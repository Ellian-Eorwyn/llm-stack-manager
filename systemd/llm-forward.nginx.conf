# llm-forward: llms's embed (8005) and rerank (8006) ports, served by the Studio.
#
# Since 2026-10-29 the embedding and reranker models run on the Studio, so GPU 0
# here can hold a second 27B. Every caller still uses llms:8005 and llms:8006
# (Hermes, Lens, gather, SillyTavern, upc-corpus, ...); Tailscale Serve hands
# those to 127.0.0.1 here, and this passes them on to the Studio.
#
# Host must be rewritten: the Studio's Tailscale Serve picks its route by Host,
# and answers "llms:8005" with a 404. The address is the Studio's tailnet IP,
# so a boot before MagicDNS is up still starts.
#
# Its own nginx instance (systemd/llm-forward.service), not a site of the main
# one, which fails at boot on the 8082 bind (see the llms-failed-units notes).
worker_processes 1;
pid /run/llm-forward-nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    server {
        listen 127.0.0.1:8005;
        location / {
            proxy_pass http://100.92.198.92:8005;
            proxy_set_header Host studio:8005;
        }
    }

    server {
        listen 127.0.0.1:8006;
        location / {
            proxy_pass http://100.92.198.92:8006;
            proxy_set_header Host studio:8006;
        }
    }
}
